<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nike Homepage</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Navigation -->
<header>
    <div class="container nav">
        <h1 class="logo">NIKE</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Sale</a>
        </nav>
    </div>
</header>

<!-- Hero Section -->
<section class="hero">
    <div class="hero-text">
        <h2>Just Do It</h2>
        <p>Discover the latest Nike collections.</p>
        <button>Shop Now</button>
    </div>
</section>

<!-- Products -->
<section class="products container">
    <h2>Featured Products</h2>

    <div class="product-grid">
        <div class="card">
            <img src="https://via.placeholder.com/250">
            <h3>Nike Air Max</h3>
            <p>$150</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250">
            <h3>Nike Revolution</h3>
            <p>$120</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250">
            <h3>Nike ZoomX</h3>
            <p>$180</p>
        </div>
    </div>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 Nike Inspired Homepage</p>
</footer>

</body>
</html>
