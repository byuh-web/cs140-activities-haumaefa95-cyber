<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        
        <label for="Name">Name:</label><br>
        <input type="text" id="Name" name="name"><br><br>

        <label for="Name">How are you from:</label><br>
        <input type="text" id="How are you from" name="name"><br>

        <p>Gender:</p>
        <input type="radio" id="Male" name="Gender" value="Male">
        <label for="Male">Male</label><br>

        <input type="radio" id="Female" name="Gender" value="Female">
        <label for="Female">Female</label><br><br>
       
        <label for="Hobbie">Hobbie:</label><br>
        <input type="text" id="Hobbie" name="Hobbie"><br><br>

        <label for="numbers">Number of Semester:</label><br>
        <input type="number" id="numbers" name="numbers"><br><br>

        <label for="email">Email address</label><br>
        <input type="email" id="email" name="email"><br><br>
        
        <label for="text">Check what are you good at;</label><br>
        <input type="checkbox" name="skills" id="html" value="HTML">
        <label for="html">HTML</label><br>

        <input type="checkbox" name="skills" id="css" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" name="skills" id="eating candies" value="eating candies">
        <label for="eating candies">EATING CANDIES</label><br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" id="message" rows="4" cols="30"></textarea><br><br>

        <input type="submit" name="submit" id="submit">

    </form>
</body>
</html>
